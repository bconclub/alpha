name: Deploy Engine

on:
  push:
    branches: [main]

jobs:
  deploy:
    # Skip version-only commits from pre-commit hook
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 12m
          script: |
            set -e
            if [ ! -d /root/alpha ]; then
              git clone https://github.com/bconclub/alpha.git /root/alpha
            fi
            cd /root/alpha
            git fetch origin main
            git reset --hard origin/main
            bash engine/deploy-vps.sh

      # The SSH step fails intermittently (connection flake) — one retry fixes
      # the vast majority. A genuinely broken deploy fails twice and stays red.
      - name: Retry deploy (SSH flake)
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 12m
          script: |
            set -e
            if [ ! -d /root/alpha ]; then
              git clone https://github.com/bconclub/alpha.git /root/alpha
            fi
            cd /root/alpha
            git fetch origin main
            git reset --hard origin/main
            bash engine/deploy-vps.sh
